# Specfold settings for the kit repo itself (dogfooding). Not shipped: the
# template's own specfold.yaml lives in template/.
kit_version: 0.0.0          # unreleased; set by the upgrader from v0.1.0 on
profile_version: 1
channel: stable

source:
  github: samiuens/specfold

requires:
  openspec: ">=1.15 <2"
  okf: "0.2"

# Test fixtures and template knowledge are left out: they hold deliberate or example references.
source_globs: ["tools/specfold/src/**", "tools/specfold/build.mjs", "scripts/**", "template/*", "template/openspec/**"]

folders:
  architecture:
    description: "CLI modules, gate pipeline and release flow"
  backlog:
    description: "Ideas and work needed later but not now"
  capabilities:
    description: "One card per kit spec: why it exists and where its contract lives"
  commitments:
    description: "Promises the project has made for later"
  conventions:
    description: "How the kit repo writes code, tests, skills and knowledge"
  decisions:
    description: "Decisions about the kit, accepted and rejected"
  domain:
    description: "Terms and business rules of the kit's problem space"
  references:
    description: "Summaries of upstream docs the kit depends on, with short stale_after"
  runbooks:
    description: "How to run recurring maintenance tasks"
  vision:
    description: "Where Specfold is heading"

gate:
  require_change_for_source_changes: true
  escape_label: no-spec
  block_on_stale_touched: true
  block_on_broken_links: true
  block_on_drift: false

types:
  - Term
  - Business Rule
  - Component
  - Data Flow
  - Interface
  - Decision
  - Capability
  - Convention
  - Runbook
  - Reference
  - Vision
  - Deferred Commitment
  - Backlog Item

actors:
  agent_prefix: "claude-code/"

# Folders that get one symlink per skill in .agents/skills/ (specfold agents sync).
agents:
  targets: [".claude/skills"]

# Concepts without `verified` older than this many days are reported by `specfold audit` (A2).
audit:
  unverified_after_days: 30

# Size limits for task breakdowns; exceeding them only warns (specfold tasks check T9, T10).
tasks:
  max_files_per_task: 5
  max_tasks_per_group: 8

# Kit tests only: fixture repositories and the sample app have their own references.
trace:
  test_globs: ["tools/specfold/test/**/*.test.ts"]

# Kit repo only: `specfold hook commit-msg` runs these after its own checks (installed by npm run setup).
hooks:
  extra:
    commit-msg:
      - node scripts/check-commit.mjs --message-file "$1"
