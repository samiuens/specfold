# Lint, type-check, test and bundle the specfold CLI, then validate the kit's own knowledge with it.
# No paths filter and no job-level if, so the check always reports.
name: cli

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint and type-check
        run: npm run check -w specfold
      - name: Test
        run: npm test -w specfold
      - name: Bundle is up to date
        run: |
          npm run build -w specfold
          git diff --exit-code -- scripts/specfold.mjs || { echo "::error::scripts/specfold.mjs is stale; run 'npm run build -w specfold' and commit it"; exit 1; }
      - name: Validate the kit's knowledge
        run: node scripts/specfold.mjs validate
      - name: Knowledge indexes are up to date
        run: node scripts/specfold.mjs index --check
      - name: Kit schema copy matches the template
        run: diff -r template/openspec/schemas/specfold openspec/schemas/specfold || { echo "::error::openspec/schemas/specfold differs from template/openspec/schemas/specfold; copy the template schema over"; exit 1; }
      - name: Kit skills and planner match the template
        run: |
          for skill in template/.agents/skills/*/; do
            name=$(basename "$skill")
            diff -r "$skill" ".agents/skills/$name" || { echo "::error::.agents/skills/$name differs from the template; copy it over"; exit 1; }
          done
          diff template/.claude/agents/planner.md .claude/agents/planner.md
      - name: Skills follow the shared frontmatter rules
        run: node scripts/check-skills.mjs .agents/skills template/.agents/skills
      - name: Skill links are up to date
        run: |
          node scripts/specfold.mjs agents sync --check
          (cd template && node scripts/specfold.mjs agents sync --check)
          (cd examples/sample-app && node scripts/specfold.mjs agents sync --check)
      - name: Template bundle is valid with its own settings
        working-directory: template
        run: |
          node ../scripts/specfold.mjs validate
          node ../scripts/specfold.mjs index --check
      - name: Template bundle matches the kit's CLI
        run: diff scripts/specfold.mjs template/scripts/specfold.mjs || { echo "::error::template/scripts/specfold.mjs is stale; copy scripts/specfold.mjs over"; exit 1; }
      - name: Sample app copies match the template
        run: |
          for path in AGENTS.md CLAUDE.md scripts/specfold.mjs openspec/schemas/specfold .agents/skills .claude/skills .claude/agents knowledge/conventions/code-comments.md; do
            diff -r "template/$path" "examples/sample-app/$path" || { echo "::error::examples/sample-app/$path differs from template/$path"; exit 1; }
          done
      - name: Sample app passes the workflow checks
        working-directory: examples/sample-app
        run: |
          npm test
          node ../../scripts/specfold.mjs validate
          node ../../scripts/specfold.mjs index --check
          ../../node_modules/.bin/openspec validate --all --strict
          for dir in openspec/changes/archive/*/; do
            node ../../scripts/specfold.mjs sync "$(basename "$dir")" --dry-run | tee /dev/stderr | grep -q "nothing to change" || { echo "::error::$(basename "$dir") is not fully synced; run specfold sync"; exit 1; }
          done
