# Lint, type-check, test and bundle the specfold CLI, then validate the kit's own knowledge with it.
# No paths filter and no job-level if, so the check always reports.
name: cli

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint and type-check
        run: npm run check -w specfold
      - name: Test
        run: npm test -w specfold
      - name: Bundle is up to date
        run: |
          npm run build -w specfold
          git diff --exit-code -- scripts/specfold.mjs || { echo "::error::scripts/specfold.mjs is stale; run 'npm run build -w specfold' and commit it"; exit 1; }
      - name: Release versions agree
        run: node tools/specfold/release.mjs check
      - name: Validate the kit's knowledge
        run: node scripts/specfold.mjs validate
      - name: Knowledge indexes are up to date
        run: node scripts/specfold.mjs index --check
      - name: Kit schema copy matches the template
        run: diff -r template/openspec/schemas/specfold openspec/schemas/specfold || { echo "::error::openspec/schemas/specfold differs from template/openspec/schemas/specfold; copy the template schema over"; exit 1; }
      - name: Kit skills and agents match the template
        run: |
          for skill in template/.agents/skills/*/; do
            name=$(basename "$skill")
            diff -r "$skill" ".agents/skills/$name" || { echo "::error::.agents/skills/$name differs from the template; copy it over"; exit 1; }
          done
          diff -r template/.claude/agents .claude/agents || { echo "::error::.claude/agents differs from template/.claude/agents; copy it over"; exit 1; }
      - name: Kit gate setup matches the template
        run: |
          for path in .claude/settings.json .github/workflows/specfold-gate-comment.yml .github/pull_request_template.md; do
            diff "template/$path" "$path" || { echo "::error::$path differs from template/$path; copy it over"; exit 1; }
          done
          # the kit installs OpenSpec with its own npm ci; everything else is the template's workflow
          sed 's#run: npm install --global @fission-ai/openspec@.*#run: npm ci --ignore-scripts#' template/.github/workflows/specfold-gate.yml \
            | diff - .github/workflows/specfold-gate.yml || { echo "::error::.github/workflows/specfold-gate.yml differs from the template beyond the OpenSpec install"; exit 1; }
      - name: Skills follow the shared frontmatter rules
        run: node scripts/check-skills.mjs .agents/skills template/.agents/skills
      - name: Skill links are up to date
        run: |
          node scripts/specfold.mjs agents sync --check
          (cd template && node scripts/specfold.mjs agents sync --check)
          (cd examples/sample-app && node scripts/specfold.mjs agents sync --check)
      - name: Template bundle is valid with its own settings
        working-directory: template
        run: |
          node ../scripts/specfold.mjs validate
          node ../scripts/specfold.mjs index --check
      - name: Template bundle matches the kit's CLI
        run: diff scripts/specfold.mjs template/scripts/specfold.mjs || { echo "::error::template/scripts/specfold.mjs is stale; copy scripts/specfold.mjs over"; exit 1; }
      - name: Sample app passes the workflow checks
        working-directory: examples/sample-app
        run: |
          npm test
          node ../../scripts/specfold.mjs validate
          node ../../scripts/specfold.mjs index --check
          ../../node_modules/.bin/openspec validate --all --strict
          for dir in openspec/changes/archive/*/; do
            node ../../scripts/specfold.mjs sync "$(basename "$dir")" --dry-run | tee /dev/stderr | grep -q "nothing to change" || { echo "::error::$(basename "$dir") is not fully synced; run specfold sync"; exit 1; }
          done

  # Upgrades repositories built from the previous two releases to this PR's build. It always reports,
  # and skips its work when the PR leaves the kit's payload alone, so it can become a required check.
  # see knowledge: /architecture/upgrade-flow.md
  upgrade-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kit payload changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE"...HEAD | grep -qE '^(template/|upgrade/|tools/specfold/|scripts/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes to the kit's payload; nothing to upgrade."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - name: Upgrade fixtures from the previous two releases
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/specfold/upgrade-fixtures.mjs
