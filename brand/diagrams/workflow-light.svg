<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc">
<title id="title">Knowledge flows into every change and comes back after archive</title>
<desc id="desc">The planning interview looks up knowledge and asks every open decision. An approved brief becomes a proposal with spec deltas, design and tasks; a rejected one is recorded as a Decision. Apply runs one worktree per task group, check runs the tests and validation, archive merges the deltas into openspec/specs, and sync writes the knowledge delta back to knowledge/.</desc>
