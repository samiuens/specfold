<path d="M694 204V266" fill="none" stroke="#5E5A52" stroke-width="1.5" marker-end="url(#arrow)"/><text x="702" y="240" text-anchor="start" fill="#5E5A52" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">yes</text>
