<rect x="634" y="268" width="120" height="56" fill="#1C1B19"/><text x="694" y="293" text-anchor="middle" fill="#F6F3EC" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Check fails</text><text x="694" y="310" text-anchor="middle" fill="#F6F3EC" fill-opacity=".75" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">fix, push again</text>
<rect x="418" y="268" width="160" height="56" fill="#1C1B19"/><text x="498" y="293" text-anchor="middle" fill="#F6F3EC" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Job summary</text><text x="498" y="310" text-anchor="middle" fill="#F6F3EC" fill-opacity=".75" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">+ one PR comment</text>
