<rect x="238" y="136" width="120" height="56" fill="#1C1B19"/><text x="298" y="161" text-anchor="middle" fill="#F6F3EC" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">specfold gate</text><text x="298" y="178" text-anchor="middle" fill="#F6F3EC" fill-opacity=".75" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">branch diff</text>
