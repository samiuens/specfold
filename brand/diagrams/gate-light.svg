<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
<title id="title">One gate, the same rules on every machine</title>
<desc id="desc">The pre-push hook, the agent stop hook (where the agent has one) and the specfold-gate CI check all run specfold gate on what the branch changes. It checks that source changes come with a change, that briefs are confirmed by a human, that knowledge validates, that scenarios are cited by tests, drift and token budgets. Blocking findings fail the check; otherwise the PR may merge. Warnings go to the job summary and one PR comment.</desc>
