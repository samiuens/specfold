<rect x="24" y="74" width="176" height="52" fill="#1C1B19"/><text x="112" y="105" text-anchor="middle" fill="#F6F3EC" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">pre-push hook</text>
