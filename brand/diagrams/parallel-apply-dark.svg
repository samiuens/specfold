<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="title desc">
<title id="title">One implementer per task group, each in its own worktree</title>
<desc id="desc">The orchestrator in the main session reads tasks.md and hands each task group its packet. Implementers work in parallel worktrees with one commit per task and are merged into the change branch per round. A task that needs a file outside its group comes back as a split proposal for the spec-writer and you. The verifier then runs tests, validation and the local gate: findings go back to their group, a pass leads to archive and sync.</desc>
