# pre-commit setup
default_install_hook_types: [pre-commit, pre-push]   # keep
fail_fast: false
repos:
  # upstream hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md", '--chars=" "']
      - id: check-yaml

  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: >-
          npx eslint
          --max-warnings 0
        language: system
