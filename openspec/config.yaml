schema: spec-driven   # switches to the specfold schema in M2

context: |
  Language: English. All artifacts are written in English; keep OpenSpec headings and SHALL/MUST in English.
  Rather ask than assume: when the request, knowledge or specs leave a decision open, ask the user (one decision per question, recommended option first).
  This repo builds Specfold, a kit that folds OKF knowledge bundles and OpenSpec into one agent workflow. The build brief is docs/plan.md.
  Project knowledge lives in knowledge/ (OKF v0.2). Start at knowledge/index.md.
  Behavior contracts live in openspec/specs/. Knowledge never restates requirements.
  Stack: TypeScript CLI on Node >= 20.19, bundled to scripts/specfold.mjs; the shipped payload lives in template/.

rules:
  proposal:
    - Link the knowledge concepts and decisions this change relies on (bundle-absolute paths such as /decisions/x.md).
    - Check knowledge/decisions/ for a rejected decision covering the same idea; if one exists, say why this differs.
  specs:
    - Observable behavior only. Rationale goes to knowledge, not into requirements.
    - Keep each requirement text under 500 characters.
  tasks:
    - Last task group is always "Knowledge": record new or changed concepts in knowledge/.
